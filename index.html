
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Love Story ❤️</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome screen -->
    <h1>A Little Surprise For You 💗</h1>

    <p>Two hearts, one beautiful story...</p>

    <!-- Start button -->
    <button id="startButton">
        Click to begin our story ❤️
    </button>


    <!-- Couple animation area -->
    <div class="scene" id="scene">

        <!-- Girl character -->
        <img
            src="assets/girl.png"
            alt="Girl character"
            class="character girl"
            id="girl"
        >

        <!-- Boy character -->
        <img
            src="assets/boy.png"
            alt="Boy character"
            class="character boy"
            id="boy"
        >

        <!-- Couple hugging -->
        <img
            src="assets/hug.png"
            alt="Couple hugging"
            class="hug"
            id="hug"
        >

        <!-- Glowing heart -->
        <div class="big-heart" id="bigHeart">
            ❤️
        </div>

    </div>


    <!-- Floating hearts -->
    <div id="floating-hearts"></div>


    <!-- Final love message -->
    <div class="love-message" id="loveMessage">

        <h2>I LOVE YOU</h2>

        <h1>CHATTAEDVA ❤️</h1>

        <p>I FOR YOUUUU YOU FOR MEEEEE 💕</p>

    </div>


    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
